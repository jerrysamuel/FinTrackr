version: "3.8"

services:
  web:
    build: .
    env_file:
      - .env.prod
    command: >
      sh -c "
      mkdir -p /app/staticfiles &&
      python manage.py collectstatic --noinput &&
      gunicorn trackr.wsgi:application --bind 0.0.0.0:${PORT}
      "
    ports:
      - "8000:8000"
    depends_on:
      - redis
  image: ghcr.io/jerrysamuel/trackr-backend:latest

  redis:
    image: redis:7-alpine
